<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Entrar</h1>
      <p class="subtitle">Acesse sua conta com segurança.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <button class="btn-primary" type="submit">Entrar</button>
      </form>

      <p class="small mt">Ainda não tem uma conta? <a href="/register.html">Criar cadastro</a></p>
    </section>
  </main>

  <script>
    async function redirectIfLoggedIn() {
      const response = await fetch("/api/auth/me");
      const data = await response.json();

      if (data.authenticated) {
        window.location.href = data.user.role === "admin"
          ? "/admin.html"
          : "/dashboard.html";
      }
    }

    function showMessage(text, type = "error") {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = `message show ${type}`;
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(data.error || "Não foi possível entrar.");
          return;
        }

        showMessage("Login realizado com sucesso.", "success");

        setTimeout(() => {
          window.location.href = data.user.role === "admin"
            ? "/admin.html"
            : "/dashboard.html";
        }, 350);
      } catch {
        showMessage("Erro de conexão com o servidor.");
      }
    });

    redirectIfLoggedIn().catch(() => {});
  </script>
</body>
</html>
